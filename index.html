<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>景清青果 ご注文</title>
<style>
:root{--g:#3a6b35;--bg:#f6f4ee;--line:#ddd8cc;--text:#222}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;font-size:16px}
header{background:var(--g);color:#fff;padding:14px 16px;font-weight:700;font-size:18px}
main{padding:12px 16px 8px;max-width:560px;margin:0 auto}
.who{margin:4px 0 12px;color:#555}
label.h{display:block;font-size:13px;color:#666;margin:16px 0 6px}
select,textarea{width:100%;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff}
.row{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 10px 10px 12px;margin-bottom:8px}
.row.zero .nm{color:#aaa}
.nm{flex:1;min-width:0}
.nm b{display:block;font-weight:600;word-break:break-all}
.nm small{color:#888}
.st{display:flex;align-items:center;gap:4px}
.st button{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#f2f2f2;font-size:20px;line-height:1}
.st input{width:56px;height:40px;text-align:center;font-size:18px;border:1px solid var(--line);border-radius:8px}
.unit{min-width:44px;font-size:13px;color:#666}
.tools{display:flex;gap:8px;margin:4px 0 8px}
.tools button{flex:1;padding:8px;border:1px solid var(--line);background:#fff;border-radius:8px;font-size:14px}
footer{padding:8px 16px 40px;max-width:560px;margin:0 auto}
#send{width:100%;display:block;padding:14px;font-size:17px;font-weight:700;color:#fff;background:var(--g);border:0;border-radius:10px}
#send:disabled{opacity:.5}
.err{color:#b3261e;margin:8px 0 0;text-align:center}
.fallback{display:block;margin:12px 0 0;padding:14px;font-size:16px;font-weight:700;color:#fff;background:#06c755;border-radius:10px;text-decoration:none;text-align:center}
.note{color:#666;font-size:14px;text-align:center}
.center{padding:48px 16px;text-align:center;color:#555}
.done{padding:32px 16px;text-align:center;max-width:560px;margin:0 auto}
.done pre{text-align:left;white-space:pre-wrap;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;font-family:inherit}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>景清青果 ご注文</header>
<div class="center" id="loading">読み込み中…</div>
<div class="center" id="fatal" hidden></div>
<main id="form" hidden>
  <div class="who" id="who"></div>
  <label class="h" for="date">納品日</label><select id="date"></select>
  <label class="h" id="qlabel">数量（0は不要）</label>
  <div class="tools" id="tools"><button type="button" id="usual">いつもの数に戻す</button><button type="button" id="clear">すべて0にする</button></div>
  <div id="items"></div>
  <label class="h" for="memo" id="mlabel">追加・ご要望（ほかの品目もここへ）</label><textarea id="memo" rows="3"></textarea>
  <p class="err" id="err"></p>
</main>
<footer id="foot" hidden><button id="send">この内容で注文する</button></footer>
<div class="done" id="done" hidden>
  <h2>ご注文を承りました</h2>
  <pre id="sum"></pre>
  <p class="note" id="donenote">トークにも注文内容を送りました。この画面は自動で閉じます。</p>
</div>

<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
// ===== 設定 =====
var LIFF_ID = "2012183843-Q91JDLxY";   // LINE DevelopersのLIFF ID
var API_URL = "https://script.google.com/macros/s/AKfycbxCQV4ygVxVOVkkqyPTH2TVcaOg8tSD3Jo55ZGLcwxwjWiYethVXbpYSl4ZzKU0WLsM/exec";   // Apps Scriptの公開URL
// =================

var $ = function (id) { return document.getElementById(id); };
var D = null, inputs = [];

function fatal(msg) { $("loading").hidden = true; $("fatal").textContent = msg; $("fatal").hidden = false; }

function api(body) {
  body.idToken = liff.getIDToken();
  return fetch(API_URL, { method: "POST", body: JSON.stringify(body) }).then(function (r) { return r.json(); });
}

function toHalf(s) { return String(s).replace(/[０-９．]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); }); }

function render() {
  $("who").textContent = D.name + " 様";
  D.dates.forEach(function (d) { var o = document.createElement("option"); o.textContent = d; $("date").appendChild(o); });
  if (!D.items.length) {
    $("qlabel").hidden = true; $("tools").hidden = true;
    $("mlabel").textContent = "ご注文内容（品目と数量）"; $("memo").rows = 6;
  }
  D.items.forEach(function (it) {
    var r = document.createElement("div"); r.className = "row";
    var nm = document.createElement("div"); nm.className = "nm";
    var b = document.createElement("b"); b.textContent = it.item; nm.appendChild(b);
    if (it.memo) { var s = document.createElement("small"); s.textContent = it.memo; nm.appendChild(s); }
    var st = document.createElement("div"); st.className = "st";
    var m = document.createElement("button"); m.type = "button"; m.textContent = "−";
    var i = document.createElement("input"); i.type = "text"; i.inputMode = "decimal"; i.value = it.def === "" ? "" : it.def;
    var p = document.createElement("button"); p.type = "button"; p.textContent = "+";
    var u = document.createElement("span"); u.className = "unit"; u.textContent = it.unit;
    function upd() { r.className = Number(toHalf(i.value)) > 0 ? "row" : "row zero"; }
    m.onclick = function () { i.value = Math.max(0, (Number(toHalf(i.value)) || 0) - 1); upd(); };
    p.onclick = function () { i.value = (Number(toHalf(i.value)) || 0) + 1; upd(); };
    i.oninput = upd; i.onfocus = function () { i.select(); };
    st.appendChild(m); st.appendChild(i); st.appendChild(p);
    r.appendChild(nm); r.appendChild(st); r.appendChild(u); $("items").appendChild(r);
    inputs.push({ it: it, i: i, upd: upd }); upd();
  });
  $("usual").onclick = function () { inputs.forEach(function (x) { x.i.value = x.it.def === "" ? "" : x.it.def; x.upd(); }); };
  $("clear").onclick = function () { inputs.forEach(function (x) { x.i.value = 0; x.upd(); }); };
  $("send").onclick = submit;
  $("loading").hidden = true; $("form").hidden = false; $("foot").hidden = false;
}

function orderText() {
  var t = ["【注文】", "納品日：" + $("date").value];
  inputs.forEach(function (x) { var n = Number(toHalf(x.i.value)); if (n > 0) t.push(x.it.item + " " + n + x.it.unit); });
  var mm = $("memo").value.trim(); if (mm) t.push("追加・ご要望：" + mm);
  return t.join("\n");
}

function showFallback(msg) {
  var btn = $("send"), err = $("err");
  err.textContent = msg || "送信できませんでした。";
  btn.disabled = false; btn.textContent = "もう一度送信する";
  var old = $("fb"); if (old) old.remove();
  if (D && D.oaBase) {
    var a = document.createElement("a"); a.id = "fb"; a.className = "fallback";
    a.href = D.oaBase + encodeURIComponent(orderText()); a.textContent = "LINEで注文内容を送る";
    err.parentNode.insertBefore(a, err.nextSibling);
  }
}

function submit() {
  var btn = $("send");
  $("err").textContent = ""; btn.disabled = true; btn.textContent = "送信中…";
  var body = { action: "liff_order", date: $("date").value, memo: $("memo").value,
               lines: inputs.map(function (x) { return { item: x.it.item, qty: x.i.value }; }) };
  var tryOnce = function () { return api(body); };
  tryOnce().catch(function () { return new Promise(function (ok) { setTimeout(ok, 1500); }).then(tryOnce); })
    .then(function (res) {
      if (!res || !res.ok) {
        $("err").textContent = (res && res.message) || "送信できませんでした。";
        btn.disabled = false; btn.textContent = "この内容で注文する";
        return;
      }
      $("form").hidden = true; $("foot").hidden = true;
      $("sum").textContent = res.summary; $("done").hidden = false; window.scrollTo(0, 0);
      // 開いたトーク（グループ・1対1）に、お客様のメッセージとして注文内容を送る
      liff.sendMessages([{ type: "text", text: D.confirmWord + "\n" + res.summary }])
        .then(function () { setTimeout(function () { liff.closeWindow(); }, 1800); })
        .catch(function () {
          $("donenote").textContent = "注文は承りました。トークへの送信はできなかったので、この画面を閉じてください。";
        });
    })
    .catch(function () { showFallback(); });
}

if (!LIFF_ID || !API_URL) {
  fatal("設定がまだ完了していません。");
} else {
  liff.init({ liffId: LIFF_ID }).then(function () {
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    return api({ action: "liff_items" }).then(function (res) {
      if (!res || !res.ok) { fatal((res && res.message) || "読み込めませんでした。LINEから開き直してください。"); return; }
      D = res; render();
    });
  }).catch(function (e) {
    fatal("読み込めませんでした。LINEアプリから開き直してください。");
    console.error(e);
  });
}
</script>
</body>
</html>
